[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axplorer"
version = "0.1.0"
description = "Standardized EDA pipeline for aligned neural + behavioral data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "h5py>=3.9",
    "fastapi>=0.104",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.24",
    "plotly>=5.18",
    "kaleido>=0.2",
    "pynapse @ file:///home/thejoshbq/Otis-Lab/Projects/Phoxel-Workbench/pynapse",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
axplorer = "api.app:main"

[tool.setuptools.packages.find]
include = ["axplorer*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
